{{- if not .Values.secrets.existingSecret }}
{{- $name := include "firstlook.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "firstlook.labels" . | nindent 4 }}
type: Opaque
data:
  webhook-token: {{ include "firstlook.keep" (dict "value" .Values.secrets.webhookToken "old" $old "key" "webhook-token") }}
  admin-token: {{ include "firstlook.keep" (dict "value" .Values.secrets.adminToken "old" $old "key" "admin-token") }}
  postgres-password: {{ include "firstlook.keep" (dict "value" .Values.secrets.postgresPassword "old" $old "key" "postgres-password") }}
  grafana-admin-password: {{ include "firstlook.keep" (dict "value" .Values.secrets.grafanaAdminPassword "old" $old "key" "grafana-admin-password") }}
  {{- range $key, $val := dict "gemini-api-key" .Values.secrets.geminiApiKey "langfuse-public-key" .Values.secrets.langfusePublicKey "langfuse-secret-key" .Values.secrets.langfuseSecretKey "github-token" .Values.secrets.githubToken }}
  {{- if $val }}
  {{ $key }}: {{ $val | b64enc }}
  {{- end }}
  {{- end }}
{{- end }}
